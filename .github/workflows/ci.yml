name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen --group monitoring

      - name: Lancer les tests
        run: uv run pytest -v --cov=src --cov=api --cov-report=term-missing --cov-fail-under=90

      - name: Construire l'image Docker
        run: docker build -t projet8-api .

      - name: Vérifier que le conteneur démarre
        run: |
          docker run -d --name api -p 8000:8000 projet8-api
          sleep 40
          curl --fail http://localhost:8000/health || (docker logs api && exit 1)
          docker stop api

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"