[project]
name = "projet8"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gradio>=6.26.0",
    "httpx>=0.28.1",
    "missingno>=0.5.2",
    "mlflow>=3.0,<4",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "optuna>=4.9.0",
    "pandas>=2.2,<3",
    "protobuf<5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]
[dependency-groups]

dev = [
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
]
[tool.coverage.run]
omit = ["src/precompute_history.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
